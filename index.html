<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tally 🤖</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-white text-stone-900 font-mono antialiased p-4">

  <div class="max-w-md mx-auto min-h-screen flex flex-col gap-6">
    <header class="flex justify-between items-center border-b border-stone-200 pb-3 pt-2">
      <h1 class="text-md font-black tracking-tighter">TALLY 🤖</h1>
      <button onclick="toggleSettings()" class="text-stone-400 hover:text-stone-900 font-bold text-[10px] uppercase tracking-wider">Settings</button>
    </header>

    <div id="settings" class="hidden bg-stone-50 p-4 rounded-lg border border-stone-200 text-xs flex flex-col gap-3">
      <div>
        <label class="block mb-1 text-stone-500 font-bold uppercase text-[9px]">Gemini API Key</label>
        <input type="password" id="apiKeyInput" class="w-full p-2 border border-stone-300 rounded bg-white">
      </div>
      <div>
        <label class="block mb-1 text-stone-500 font-bold uppercase text-[9px]">Supabase URL</label>
        <input type="text" id="sbUrlInput" class="w-full p-2 border border-stone-300 rounded bg-white">
      </div>
      <div>
        <label class="block mb-1 text-stone-500 font-bold uppercase text-[9px]">Supabase Anon Key</label>
        <input type="password" id="sbKeyInput" class="w-full p-2 border border-stone-300 rounded bg-white">
      </div>
      <div>
        <label class="block mb-1 text-stone-500 font-bold uppercase text-[9px]">Sync Phrase</label>
        <input type="text" id="syncKeyInput" class="w-full p-2 border border-stone-300 rounded bg-white">
      </div>
      <button onclick="saveSettings()" class="w-full bg-stone-900 text-white font-bold py-2 rounded uppercase text-[10px]">Save</button>
    </div>

    <div class="grid grid-cols-2 gap-3 text-center">
      <div class="border border-stone-200 p-3 rounded-lg bg-stone-50">
        <div class="text-[10px] text-stone-400 uppercase font-bold tracking-tight">Calories In</div>
        <div class="text-lg font-black mt-0.5"><span id="totalCal">0</span> <span class="text-xs font-normal text-stone-400">kcal</span></div>
      </div>
      <div class="border border-stone-200 p-3 rounded-lg bg-stone-50">
        <div class="text-[10px] text-stone-400 uppercase font-bold tracking-tight">Protein</div>
        <div class="text-lg font-black mt-0.5"><span id="totalProtein">0</span> <span class="text-xs font-normal text-stone-400">g</span></div>
      </div>
    </div>

    <form onsubmit="handleLogSubmit(event)" class="flex flex-col gap-3">
      <div class="flex justify-between items-center">
        <span class="text-[10px] font-bold tracking-wider text-stone-400 uppercase">Write Entry</span>
        <input type="date" id="entryDate" class="text-xs border border-stone-200 rounded px-2 py-0.5 bg-stone-50" onchange="renderDashboard()">
      </div>
      <textarea id="rawText" rows="4" required placeholder="Type organically... (e.g., Skyr raspberry, shared pasta with Sam)" class="w-full p-3 border border-stone-200 rounded-lg text-sm font-sans focus:outline-none focus:border-stone-900 resize-none bg-white"></textarea>
      <button type="submit" id="submitBtn" class="w-full bg-stone-900 text-white font-bold text-xs py-2.5 rounded hover:bg-stone-800 uppercase tracking-wider">Log Day</button>
    </form>

    <div class="space-y-3">
      <h3 class="text-[10px] font-black tracking-wider text-stone-400 uppercase">Today's History</h3>
      <div id="logFeed" class="flex flex-col gap-2"></div>
    </div>
  </div>

  <script>
    let appState = JSON.parse(localStorage.getItem('body_admin_data')) || { entries: [] };
    let supabaseClient = null;
    
    document.getElementById('entryDate').value = new Date().toISOString().split('T')[0];

    function toggleSettings() { document.getElementById('settings').classList.toggle('hidden'); }

    function saveSettings() {
      localStorage.setItem('gemini_key', document.getElementById('apiKeyInput').value.trim());
      localStorage.setItem('sb_url', document.getElementById('sbUrlInput').value.trim());
      localStorage.setItem('sb_key', document.getElementById('sbKeyInput').value.trim());
      localStorage.setItem('sync_phrase', document.getElementById('syncKeyInput').value.trim());
      toggleSettings();
      initSupabase();
    }

    function initSupabase() {
      const url = localStorage.getItem('sb_url');
      const key = localStorage.getItem('sb_key');
      const syncKey = localStorage.getItem('sync_phrase') || 'tally-' + Math.random().toString(36).substring(2, 7);
      
      localStorage.setItem('sync_phrase', syncKey);
      document.getElementById('syncKeyInput').value = syncKey;
      document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_key') || '';

      if (url && key) {
        supabaseClient = supabase.createClient(url, key);
        document.getElementById('sbUrlInput').value = url;
        document.getElementById('sbKeyInput').value = key;
        pullData();
      }
    }

    async function pullData() {
      if (!supabaseClient) return;
      try {
        const { data } = await supabaseClient.from('sync_entries').select('*').eq('sync_key', localStorage.getItem('sync_phrase'));
        if (data) {
          appState.entries = data.map(row => ({
            id: row.id, date: row.entry_date, rawText: row.raw_text, parsed: row.parsed_json
          }));
          localStorage.setItem('body_admin_data', JSON.stringify(appState));
          renderDashboard();
        }
      } catch (err) { console.error(err); }
    }

    function renderDashboard() {
      const targetDate = document.getElementById('entryDate').value;
      const daysEntries = appState.entries.filter(e => e.date === targetDate);
      
      let cal = 0, prot = 0;
      const feedEl = document.getElementById('logFeed');
      feedEl.innerHTML = '';

      if (daysEntries.length === 0) {
        feedEl.innerHTML = '<p class="text-xs text-stone-300 italic text-center py-2">Nothing logged for this day yet.</p>';
      } else {
        daysEntries.forEach(entry => {
          const parsed = entry.parsed || {};
          let foodItems = [];
          
          if (parsed.foods && Array.isArray(parsed.foods)) {
            parsed.foods.forEach(f => {
              cal += Number(f.calories || 0);
              prot += Number(f.protein || 0);
              foodItems.push(`<li>✨ ${f.name} <span class="text-stone-400">(${f.calories} kcal, ${f.protein}g)</span></li>`);
            });
          }

          feedEl.innerHTML += `
            <div class="border border-stone-200 p-3 bg-white rounded text-xs space-y-1.5">
              <div class="italic text-stone-600 bg-stone-50 p-2 rounded">"${entry.rawText}"</div>
              <ul class="list-none space-y-0.5 text-stone-800">${foodItems.join('') || '<li class="text-stone-400 italic">Processing text context...</li>'}</ul>
            </div>
          `;
        });
      }

      document.getElementById('totalCal').innerText = Math.round(cal);
      document.getElementById('totalProtein').innerText = Math.round(prot);
    }

    async function handleLogSubmit(e) {
      e.preventDefault();
      const txtEl = document.getElementById('rawText');
      const dateEl = document.getElementById('entryDate');
      const btn = document.getElementById('submitBtn');
      const text = txtEl.value.trim();
      const apiKey = localStorage.getItem('gemini_key');

      if (!apiKey) return alert("Please add your Gemini Key in Settings first.");

      btn.disabled = true;
      btn.innerText = "PARSING...";

      const item = {
        id: crypto.randomUUID(),
        date: dateEl.value,
        rawText: text,
        parsed: { foods: [] }
      };

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `Return raw JSON only for this meal entry text.
              Structure: { "foods": [{ "name": "string", "calories": 0, "protein": 0 }] }
              Text: "${text}"` }] }],
            generationConfig: { responseMimeType: "application/json" }
          })
        });

        if (response.ok) {
          const resData = await response.json();
          let jsonText = resData.candidates[0].content.parts[0].text.trim();
          item.parsed = JSON.parse(jsonText);
        }
      } catch (err) { console.error(err); }

      appState.entries.push(item);
      localStorage.setItem('body_admin_data', JSON.stringify(appState));

      if (supabaseClient) {
        await supabaseClient.from('sync_entries').insert({
          id: item.id,
          sync_key: localStorage.getItem('sync_phrase'),
          entry_date: item.date,
          raw_text: item.rawText,
          parsed_json: item.parsed
        });
      }

      txtEl.value = '';
      renderDashboard();
      btn.disabled = false;
      btn.innerText = "LOG DAY";
    }

    initSupabase();
    renderDashboard();
  </script>
</body>
</html>
