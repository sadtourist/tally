<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tally</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tally">
</head>
<body class="bg-white text-stone-900 font-mono antialiased">

<div class="max-w-md mx-auto min-h-screen p-4 flex flex-col">

  <header class="flex justify-between items-center mb-6 pt-2 border-b border-stone-200 pb-3">
    <h1 class="text-md font-black tracking-tighter">TALLY</h1>
    <button onclick="toggleSettings()" class="text-stone-400 hover:text-stone-900 text-[10px] tracking-wider uppercase">Settings</button>
  </header>

  <div id="settings" class="hidden bg-stone-50 p-4 rounded-xl border border-stone-200 mb-6 flex flex-col gap-3 text-xs">
    <div>
      <label class="block mb-1 text-stone-500 text-[9px] uppercase">Gemini API Key</label>
      <input type="password" id="geminiKey" class="w-full p-2 border border-stone-300 rounded text-xs">
    </div>
    <div>
      <label class="block mb-1 text-stone-500 text-[9px] uppercase">Supabase URL</label>
      <input type="text" id="sbUrl" class="w-full p-2 border border-stone-300 rounded text-xs">
    </div>
    <div>
      <label class="block mb-1 text-stone-500 text-[9px] uppercase">Supabase Anon Key</label>
      <input type="password" id="sbKey" class="w-full p-2 border border-stone-300 rounded text-xs">
    </div>
    <button onclick="saveSettings()" class="w-full bg-stone-900 text-white font-bold py-2 rounded text-[10px] uppercase tracking-wider">Save</button>
    <p class="text-stone-400 text-[10px] leading-relaxed">Use the exact same three values on every device — that's what makes entries show up everywhere.</p>
  </div>

  <div id="banner" class="hidden mb-4 p-3 rounded text-xs leading-relaxed"></div>

  <form onsubmit="addEntry(event)" class="flex flex-col gap-3 mb-6">
    <textarea id="rawText" rows="4" required placeholder="Type what you ate or did... e.g. Skyr with raspberries, 30 min run"
      class="w-full p-3 border border-stone-200 rounded-lg text-sm font-sans focus:outline-none focus:border-stone-900 resize-none"></textarea>
    <button type="submit" id="submitBtn" class="bg-stone-900 text-white font-bold text-xs px-6 py-2.5 rounded uppercase tracking-wider">Add Entry</button>
  </form>

  <div class="grid grid-cols-3 gap-2 text-center mb-6">
    <div class="border border-stone-200 p-2.5 rounded">
      <div class="text-[9px] text-stone-400 uppercase">Calories</div>
      <div class="text-md font-black"><span id="totalCal">0</span></div>
    </div>
    <div class="border border-stone-200 p-2.5 rounded">
      <div class="text-[9px] text-stone-400 uppercase">Protein</div>
      <div class="text-md font-black"><span id="totalProtein">0</span>g</div>
    </div>
    <div class="border border-stone-200 p-2.5 rounded">
      <div class="text-[9px] text-stone-400 uppercase">Burned</div>
      <div class="text-md font-black"><span id="totalBurned">0</span></div>
    </div>
  </div>

  <h3 class="text-[10px] font-black tracking-wider text-stone-400 uppercase mb-2">Entries</h3>
  <div id="feed" class="flex flex-col gap-2 pb-10">
    <p class="text-xs text-stone-300 italic text-center py-6">No entries yet.</p>
  </div>

</div>

<script>
  let supabaseClient = null;
  let entries = [];

  function todayStr() { return new Date().toISOString().split('T')[0]; }

  function showBanner(msg, kind) {
    const b = document.getElementById('banner');
    b.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'border', 'border-red-200', 'bg-amber-50', 'text-amber-700', 'border-amber-200');
    if (kind === 'error') b.classList.add('bg-red-50', 'text-red-700', 'border', 'border-red-200');
    else b.classList.add('bg-amber-50', 'text-amber-700', 'border', 'border-amber-200');
    b.innerText = msg;
  }
  function clearBanner() { document.getElementById('banner').classList.add('hidden'); }

  function toggleSettings() { document.getElementById('settings').classList.toggle('hidden'); }

  function loadSettingsIntoForm() {
    document.getElementById('geminiKey').value = localStorage.getItem('gemini_key') || '';
    document.getElementById('sbUrl').value = localStorage.getItem('sb_url') || '';
    document.getElementById('sbKey').value = localStorage.getItem('sb_key') || '';
  }

  function saveSettings() {
    localStorage.setItem('gemini_key', document.getElementById('geminiKey').value.trim());
    localStorage.setItem('sb_url', document.getElementById('sbUrl').value.trim());
    localStorage.setItem('sb_key', document.getElementById('sbKey').value.trim());
    toggleSettings();
    initSupabase();
  }

  function initSupabase() {
    const url = localStorage.getItem('sb_url');
    const key = localStorage.getItem('sb_key');
    if (url && key) {
      try {
        supabaseClient = supabase.createClient(url, key);
        fetchEntries();
      } catch (err) {
        showBanner('Could not connect to Supabase: ' + err.message, 'error');
      }
    } else {
      showBanner('Open Settings and add your Supabase URL + key to start saving entries.', 'warn');
    }
  }

  async function fetchEntries() {
    if (!supabaseClient) return;
    const { data, error } = await supabaseClient
      .from('entries')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      showBanner('Could not load entries: ' + error.message, 'error');
      return;
    }
    clearBanner();
    entries = data || [];
    render();
  }

  async function callGemini(text) {
    const apiKey = localStorage.getItem('gemini_key');
    const prompt = `Parse this food/activity log into JSON. Be realistic, don't overestimate.
Return ONLY this JSON shape, no other text:
{"summary": "short clean one-line description", "calories": 0, "protein": 0, "exercise_calories": 0}

Log: "${text}"`;

    const body = JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { responseMimeType: "application/json" }
    });

    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

    let response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });

    if (!response.ok && response.status === 503) {
      await new Promise(r => setTimeout(r, 1500));
      response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
    }

    if (!response.ok) {
      const errBody = await response.text();
      throw new Error(`Gemini error (HTTP ${response.status}): ${errBody.slice(0, 200)}`);
    }

    const data = await response.json();
    const jsonText = data.candidates[0].content.parts[0].text;
    return JSON.parse(jsonText);
  }

  async function addEntry(e) {
    e.preventDefault();
    clearBanner();
    const txtEl = document.getElementById('rawText');
    const btn = document.getElementById('submitBtn');
    const text = txtEl.value.trim();
    if (!text) return;

    if (!localStorage.getItem('gemini_key')) {
      showBanner('Add your Gemini API key in Settings first.', 'error');
      return;
    }
    if (!supabaseClient) {
      showBanner('Add your Supabase URL + key in Settings first.', 'error');
      return;
    }

    btn.disabled = true;
    btn.innerText = 'SAVING...';

    try {
      const parsed = await callGemini(text);

      const { error } = await supabaseClient.from('entries').insert({
        raw_text: text,
        summary: parsed.summary || text,
        calories: Number(parsed.calories) || 0,
        protein: Number(parsed.protein) || 0,
        exercise_calories: Number(parsed.exercise_calories) || 0
      });

      if (error) throw new Error('Supabase insert failed: ' + error.message);

      txtEl.value = '';
      await fetchEntries();

    } catch (err) {
      showBanner(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerText = 'ADD ENTRY';
    }
  }

  async function deleteEntry(id) {
    if (!supabaseClient) return;
    const { error } = await supabaseClient.from('entries').delete().eq('id', id);
    if (error) { showBanner('Could not delete: ' + error.message, 'error'); return; }
    await fetchEntries();
  }

  function render() {
    const today = todayStr();
    const todays = entries.filter(e => (e.created_at || '').split('T')[0] === today);

    const cal = todays.reduce((s, e) => s + (e.calories || 0), 0);
    const prot = todays.reduce((s, e) => s + (e.protein || 0), 0);
    const burn = todays.reduce((s, e) => s + (e.exercise_calories || 0), 0);

    document.getElementById('totalCal').innerText = cal;
    document.getElementById('totalProtein').innerText = prot;
    document.getElementById('totalBurned').innerText = burn;

    const feed = document.getElementById('feed');
    if (entries.length === 0) {
      feed.innerHTML = '<p class="text-xs text-stone-300 italic text-center py-6">No entries yet.</p>';
      return;
    }

    feed.innerHTML = entries.map(e => {
      const date = new Date(e.created_at);
      const dateLabel = date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      const timeLabel = date.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
      return `
        <div class="border border-stone-200 p-3 rounded text-xs space-y-1.5">
          <div class="flex justify-between items-start gap-2">
            <span class="font-sans text-stone-900">${e.summary || e.raw_text}</span>
            <button onclick="deleteEntry('${e.id}')" class="text-stone-300 hover:text-red-500 text-[10px] shrink-0">✕</button>
          </div>
          <div class="flex justify-between text-[10px] text-stone-400">
            <span>${dateLabel} · ${timeLabel}</span>
            <span>${e.calories || 0} kcal · ${e.protein || 0}g protein${e.exercise_calories ? ' · ' + e.exercise_calories + ' burned' : ''}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  loadSettingsIntoForm();
  initSupabase();
</script>
</body>
</html>
